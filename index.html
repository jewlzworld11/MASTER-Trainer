<style>
/* VOICE: a quiet observatory with a neon cockpit on top
   IDEA: a NASA deep-field you can fly through; neon only on the instruments
   PICTURE: the spiral galaxy itself, full screen, always
   COLOUR and TYPE: real space colours in the scene; his six neons on black for the UI; Orbitron labels, Exo 2 text, JetBrains Mono codes
   LAYOUT: HUD on the corners, panel on the right (bottom sheet on phones), nothing over the centre */
:root{
  --pink:#FF4FB0; --orange:#FF9E45; --teal:#2FE6C8; --sky:#6FC3FF; --violet:#B48CFF; --gold:#FFD25A;
  --ink:#EAF6FF; --dim:#8FA3B8; --glass:rgba(0,0,0,.78); --line:rgba(111,195,255,.38);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#000;color:var(--ink);overflow:hidden;
  font:15px/1.5 "Exo 2",system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;touch-action:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
.orb{font-family:Orbitron,"Exo 2",sans-serif;letter-spacing:.06em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:5;pointer-events:none}
.hud>*{pointer-events:auto}
#top{top:calc(12px + var(--safe-t));left:14px;right:14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;pointer-events:none}
#top>*{pointer-events:auto}
#top>div:first-child{background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.45));padding:8px 12px 2px 8px;border-radius:4px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 0 8px rgba(47,230,200,.55))}
.brand b{display:block;font:900 15px/1 Orbitron,sans-serif;letter-spacing:.12em;text-shadow:0 0 12px rgba(255,79,176,.6)}
.brand small{display:block;font:600 10.5px/1.2 Orbitron,sans-serif;letter-spacing:.18em;color:var(--teal);margin-top:4px}
#crumbs{display:flex;flex-wrap:wrap;gap:2px;align-items:center;margin-top:10px;font:600 12px/1 Orbitron,sans-serif;letter-spacing:.05em}
#crumbs button{background:none;border:0;padding:6px 4px;color:var(--dim)}
#crumbs button:hover{color:var(--teal)}
#crumbs button[aria-current]{color:var(--ink);text-shadow:0 0 10px var(--teal)}
#crumbs i{color:var(--pink);font-style:normal;opacity:.8}
.tr{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nbtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:4px;border:1px solid var(--c,var(--teal));
  background:rgba(0,0,0,.65);color:var(--ink);text-decoration:none;font:700 11.5px/1 Orbitron,sans-serif;letter-spacing:.08em;
  box-shadow:0 0 12px -2px var(--c,var(--teal)),inset 0 0 10px -4px var(--c,var(--teal));clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:.2s}
.nbtn:hover{background:color-mix(in srgb,var(--c,var(--teal)) 18%,#000)}
.nbtn svg{width:17px;height:17px;flex:none}
.nbtn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.nbtn.primary{background:color-mix(in srgb,var(--c,var(--teal)) 22%,#000);min-height:46px;padding:0 18px;font-size:12.5px}

#core{left:14px;bottom:calc(14px + var(--safe-b));display:flex;gap:12px;align-items:center;padding:10px 14px 10px 10px;border:1px solid rgba(255,210,90,.5);
  background:rgba(0,0,0,.6);border-radius:4px;box-shadow:0 0 16px -4px var(--gold);clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px)}
.ringm{--p:0;--c:var(--gold);width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(#000 58%,transparent 60%),conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.1) 0);filter:drop-shadow(0 0 6px var(--c))}
.ringm b{font:700 11px/1 Orbitron,sans-serif}
#core small{display:block;font:700 10px/1 Orbitron,sans-serif;letter-spacing:.16em;color:var(--gold)}
#core span{font-size:12.5px;color:var(--dim)}
#bottom{left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:8px}
#hint{font-size:12.5px;color:var(--dim);text-align:center;text-shadow:0 1px 4px #000;max-width:min(560px,70vw)}
#back[hidden]{display:none}

/* ---------- labels ---------- */
#tags{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font:600 10.5px/1 Orbitron,sans-serif;letter-spacing:.12em;color:var(--c,var(--ink));
  text-shadow:0 0 8px var(--c,#fff),0 1px 3px #000;opacity:0;transition:opacity .35s;will-change:transform}
.tag.on{opacity:.85}
.tag.lock{color:#8b98a8;text-shadow:0 1px 3px #000}
.tag.big{font-size:12px;letter-spacing:.2em}
#holo{position:fixed;z-index:6;left:0;top:0;pointer-events:none;min-width:200px;max-width:280px;padding:12px 14px 12px;
  background:linear-gradient(180deg,rgba(47,230,200,.10),rgba(0,0,0,.82) 40%),repeating-linear-gradient(0deg,rgba(111,195,255,.05) 0 1px,transparent 1px 3px);
  border:1px solid var(--c,var(--teal));box-shadow:0 0 18px -4px var(--c,var(--teal)),inset 0 0 18px -10px var(--c,var(--teal));
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
#holo.on{opacity:1;transform:none}
#holo .k{font:700 9.5px/1 Orbitron,sans-serif;letter-spacing:.2em;color:var(--c,var(--teal))}
#holo h4{margin:6px 0 2px;font:700 15px/1.2 Orbitron,sans-serif;letter-spacing:.04em}
#holo .c{font:12px/1.4 "JetBrains Mono",monospace;color:var(--dim)}
#holo .bar{height:4px;background:rgba(255,255,255,.1);margin-top:9px}
#holo .bar i{display:block;height:100%;background:var(--c,var(--teal));box-shadow:0 0 8px var(--c,var(--teal))}
#holo .p{margin-top:6px;font-size:12px}

/* ---------- panel (trainer panel) ---------- */
#panel{position:fixed;z-index:7;top:calc(74px + var(--safe-t));right:14px;bottom:calc(84px + var(--safe-b));width:min(400px,calc(100vw - 28px));
  background:var(--glass);border:1px solid var(--a,var(--teal));box-shadow:0 0 28px -8px var(--a,var(--teal)),inset 0 0 30px -18px var(--a,var(--teal));
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  transform:translateX(calc(100% + 30px));opacity:0;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s;touch-action:pan-y}
#panel.on{transform:none;opacity:1}
#pbody{overflow:auto;padding:18px 18px 20px;overscroll-behavior:contain;flex:1}
.ph{display:flex;gap:12px;align-items:flex-start}
.pico{width:46px;height:46px;flex:none;display:grid;place-items:center;border:1px solid var(--a);color:var(--a);border-radius:4px;box-shadow:0 0 12px -3px var(--a)}
.pico svg{width:24px;height:24px}
.ph small{display:block;font:700 9.5px/1.3 Orbitron,sans-serif;letter-spacing:.18em;color:var(--a)}
.ph h2{margin:4px 0 2px;font:700 20px/1.15 Orbitron,sans-serif;letter-spacing:.03em;text-wrap:balance}
.ph .code{margin:0;font:12.5px/1.4 "JetBrains Mono",monospace;color:var(--dim)}
.x{margin-left:auto;flex:none;width:40px;height:40px;border:1px solid rgba(255,255,255,.25);background:#000;border-radius:4px;display:grid;place-items:center}
.x svg{width:18px;height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 2px}
.chip{font:700 9.5px/1 Orbitron,sans-serif;letter-spacing:.14em;padding:6px 8px;border:1px solid var(--c,var(--a));color:var(--c,var(--a));border-radius:2px}
.stats{display:flex;gap:14px;align-items:center;margin:16px 0 4px;padding:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.02)}
.stats .ringm{width:64px;height:64px;--c:var(--a)}
.stats .ringm b{font-size:14px}
.stats ul{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:3px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--c);box-shadow:0 0 6px var(--c)}
.sync{margin:10px 0 0;padding:10px 12px;border-left:2px solid var(--a);background:rgba(255,255,255,.03);font-size:13px;color:var(--dim)}
.sync b{color:var(--ink);font-weight:600}
.sec{margin:20px 0 8px;font:700 11px/1 Orbitron,sans-serif;letter-spacing:.18em;color:var(--a);display:flex;gap:8px;align-items:center}
.sec::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--a),transparent)}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:center;padding:10px;border:1px solid rgba(255,255,255,.14);border-radius:3px;background:rgba(0,0,0,.5)}
.step.mastered{border-color:color-mix(in srgb,var(--a) 70%,transparent);box-shadow:0 0 12px -6px var(--a)}
.step.progress{border-color:rgba(255,158,69,.6)}
.num{grid-row:span 2;width:34px;height:34px;display:grid;place-items:center;font:700 12px/1 Orbitron,sans-serif;color:var(--a);border:1px solid var(--a);border-radius:50%;box-shadow:0 0 10px -3px var(--a)}
.uname{background:none;border:0;padding:4px 0;text-align:left;font-weight:600;font-size:14.5px;display:flex;gap:6px;align-items:center}
.uname:hover{color:var(--a)}
.uname svg{width:14px;height:14px;opacity:.6}
.seg{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:3px;overflow:hidden}
.seg button{flex:1;min-height:34px;border:0;background:#000;color:var(--dim);font:600 11px/1 "Exo 2",sans-serif;padding:0 6px;border-right:1px solid rgba(255,255,255,.14)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true][data-s=locked]{background:#1a1f27;color:#cfd8e3}
.seg button[aria-pressed=true][data-s=progress]{background:rgba(255,158,69,.22);color:#FFC28A}
.seg button[aria-pressed=true][data-s=mastered]{background:color-mix(in srgb,var(--a) 28%,#000);color:#fff;text-shadow:0 0 6px var(--a)}
.note{font-size:12.5px;color:var(--dim);margin:10px 0 0}
.ubar{display:flex;align-items:center;gap:9px}.ubar .track{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.ubar .track i{display:block;height:100%;background:var(--a);box-shadow:0 0 8px var(--a)}
.ubar b{font:700 11px/1 Orbitron,sans-serif;color:var(--a);min-width:34px;text-align:right}
.ugo{min-height:32px;padding:0 10px;border:1px solid var(--a);background:#000;border-radius:3px;font:700 10px/1 Orbitron,sans-serif;letter-spacing:.08em;color:#fff}.ugo:hover{background:color-mix(in srgb,var(--a) 22%,#000)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.acts .nbtn{--c:var(--a)}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:1px solid rgba(255,255,255,.12);padding:9px 10px;border-radius:3px;text-align:left}
.barrow:hover{border-color:var(--c)}
.barrow .num{grid-row:auto;width:28px;height:28px;font-size:10.5px;color:var(--c);border-color:var(--c)}
.barrow em{font-style:normal;font-size:13.5px;font-weight:600;display:block}
.barrow .track{height:4px;background:rgba(255,255,255,.1);margin-top:5px}
.barrow .track i{display:block;height:100%;background:var(--c);box-shadow:0 0 8px var(--c)}
.barrow b{font:700 11px/1 Orbitron,sans-serif;color:var(--c)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.6);padding:16px}
#modal[hidden]{display:none}
.mbox{width:min(520px,100%);max-height:90vh;overflow:auto;background:#000;border:1px solid var(--teal);box-shadow:0 0 30px -8px var(--teal);padding:20px;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.mbox h3{margin:0 0 6px;font:700 16px/1.2 Orbitron,sans-serif;letter-spacing:.06em}
.mbox p{margin:6px 0;color:var(--dim);font-size:13.5px}
.mbox textarea{width:100%;min-height:140px;margin-top:10px;background:#05080c;color:#cfe;border:1px solid rgba(111,195,255,.4);border-radius:3px;padding:10px;font:12px/1.45 "JetBrains Mono",monospace;resize:vertical}
.mbox .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.mbox .msg{min-height:1.4em;color:var(--teal);font-size:13px;margin-top:10px}
.mbox input[type=file]{font-size:13px;color:var(--dim);margin-top:10px;max-width:100%}

/* ---------- effects ---------- */
#fx{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0}
#fx.warp{background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(170,220,255,.0) 0deg 2.2deg,rgba(170,220,255,.55) 2.4deg 2.6deg,rgba(170,220,255,0) 2.8deg 7deg);
  -webkit-mask:radial-gradient(circle at 50% 50%,transparent 12%,#000 60%);mask:radial-gradient(circle at 50% 50%,transparent 12%,#000 60%);animation:warp 1.6s ease-in-out}
#fx.entry{background:radial-gradient(circle at 50% 50%,transparent 26%,rgba(255,120,40,.35) 52%,rgba(255,70,140,.6) 75%,rgba(255,220,160,.85) 100%);animation:entry 1.25s ease-out}
@keyframes warp{0%{opacity:0;transform:scale(1.6) rotate(0)}35%{opacity:.9}100%{opacity:0;transform:scale(.6) rotate(8deg)}}
@keyframes entry{0%{opacity:0;transform:scale(1.3)}25%{opacity:1}60%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
#flare{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen}
#flare i{position:absolute;left:0;top:0;border-radius:50%;opacity:0;will-change:transform,opacity}
#toast{position:fixed;z-index:9;left:50%;top:calc(90px + var(--safe-t));transform:translate(-50%,-10px);max-width:min(460px,calc(100vw - 28px));padding:12px 16px;background:#000;
  border:1px solid var(--c,var(--teal));box-shadow:0 0 18px -4px var(--c,var(--teal));font-size:13.5px;opacity:0;transition:.3s;pointer-events:none;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast b{font:700 11px/1 Orbitron,sans-serif;letter-spacing:.14em;color:var(--c,var(--teal));display:block;margin-bottom:5px}
#loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#000;transition:opacity .35s}
#loader.done{opacity:0;pointer-events:none}

#loader span{display:block;margin-top:12px;font:600 11px/1 Orbitron,sans-serif;letter-spacing:.2em;color:var(--teal)}

@keyframes scan{0%{transform:scaleX(.1)}50%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
#fail{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;z-index:40;background:#000}

@media (max-width:700px){
  .brand svg{width:32px;height:32px}
  .brand b{font-size:12.5px}
  #crumbs{font-size:10.5px;margin-top:6px}
  .nbtn{min-height:40px;padding:0 10px;font-size:10px}
  .nbtn .lbl{display:none}
  #panel{top:auto;left:0;right:0;bottom:0;width:100%;max-height:64vh;transform:translateY(105%);
    clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%,0 16px);border-bottom:0;padding-bottom:var(--safe-b)}
  #core{bottom:calc(64px + var(--safe-b));padding:7px 10px 7px 7px}
  #core .ringm{width:38px;height:38px}
  #core span{display:none}
  #bottom{bottom:calc(12px + var(--safe-b));width:calc(100vw - 28px)}
  #hint{font-size:11.5px;max-width:100%}
  #holo{min-width:170px}
}
@media (prefers-reduced-motion:reduce){#fx{display:none}*{transition-duration:.01s!important;animation-duration:.01s!important}}

             L(L(g(p[AA + 1], x, y, z - 1), g(p[BA + 1], x - 1, y, z - 1), u), L(g(p[AB + 1], x, y - 1, z - 1), g(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);

/* ---------------- canvas sprite textures ---------------- */

const glowTex = canvasTex(128, (x, s) => { const g = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.15, 'rgba(255,255,255,.55)'); g.addColorStop(.45, 'rgba(255,255,255,.12)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, s, s); });

  const c = s / 2, g = x.createRadialGradient(c, c, 0, c, c, c); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.06, 'rgba(255,255,255,.9)'); g.addColorStop(.2, 'rgba(255,255,255,.22)'); g.addColorStop(1, 'rgba(255,255,255,0)');

const flareEls = [...document.querySelectorAll('#flare i')];
const FL = [{ f: 0, s: 260, c: 'rgba(255,214,150,.42)' }, { f: .28, s: 46, c: 'rgba(111,195,255,.22)' }, { f: .55, s: 90, c: 'rgba(180,140,255,.14)' }, { f: .8, s: 30, c: 'rgba(255,158,69,.25)' }, { f: 1.15, s: 140, c: 'rgba(47,230,200,.10)' }, { f: 1.45, s: 60, c: 'rgba(255,79,176,.16)' }];

function flareStep() {
  let show = 0; const W = innerWidth, H = innerHeight;
  if (level !== 'galaxy' && level !== 'business') {

    if (tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1) {
      const sx = (tmpV.x + 1) / 2 * W, sy = (1 - tmpV.y) / 2 * H, cd = camera.position.distanceTo(SYS);
      show = smooth(1.15, .2, Math.hypot(tmpV.x, tmpV.y)) * smooth(SUN_R * 2, SUN_R * 6, cd);
      for (const p of planets) { const pw = wpos(p.mesh, tmpW); const pd = pw.distanceTo(camera.position); if (pd > cd) continue; pw.project(camera); const px = (pw.x + 1) / 2 * W, py = (1 - pw.y) / 2 * H; const pr = p.R / pd * pxScale() / renderer.getPixelRatio(); if (Math.hypot(px - sx, py - sy) < pr) { show = 0; break; } }

}

  const t = totalStats();
  mbox.innerHTML = `<h3 id="mTitle">PROGRESS BACKUP</h3><p>${t.mastered} of ${t.total} units mastered. Progress saves on this device by itself. Export backs up everything at once: the galaxy plus every trainer's progress. Use it to keep a safe copy or move to another device or your desktop app.</p>
    <div class="row"><button class="nbtn primary" type="button" data-m="export">${svg('go')}Export progress</button><button class="nbtn" type="button" data-m="import" style="--c:var(--violet)">Import progress</button><button class="nbtn" type="button" data-m="close" style="--c:#8b98a8">Close</button></div>
    <div id="mArea"></div><div class="msg" id="mMsg"></div>
    <div class="row" style="margin-top:22px"><button class="nbtn" type="button" data-m="reset" style="--c:#FF6B6B">Reset coming-soon moons</button></div>`;
  modal.hidden = false;
}
$('#btnProg').addEventListener('click', openProgress);
let resetArmed = 0;
mbox.addEventListener('click', async e => {
  const b = e.target.closest('button[data-m]'); if (!b) return; const m = b.dataset.m, area = $('#mArea'), msg = $('#mMsg');
  if (m === 'close') closeModal();
  if (m === 'export') {
    const json = exportJSON(), name = 'jewlz-galaxy-progress-' + new Date().toISOString().slice(0, 10) + '.json';
    area.innerHTML = `<textarea readonly aria-label="Progress backup">${esc(json)}</textarea><div class="row"><button class="nbtn" type="button" data-m="copy">Copy backup text</button></div>`;
    let saved = false;
    try { const dl = await Promise.race([dlP, new Promise(r => setTimeout(() => r(null), 1500))]); if (dl) { await dl.save({ filename: name, data: json }); saved = true; } } catch (err) { saved = false; }
    if (!saved && !window.claude) { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); saved = true; } catch (err) {} }
    msg.textContent = saved ? 'Backup file saved: ' + name + '. The same text is below if you need it.' : 'If no file downloaded, copy the text below and save it as ' + name + '.';
  }
  if (m === 'copy') { const ta = area.querySelector('textarea'); try { await navigator.clipboard.writeText(ta.value); msg.textContent = 'Copied.'; } catch (err) { ta.select(); msg.textContent = 'Select all and copy it by hand.'; } }
  if (m === 'import') {
    area.innerHTML = `<p>Pick a backup file, or paste the backup text.</p><input type="file" id="mFile" accept=".json,application/json"><textarea id="mPaste" placeholder='{"app":"jewlz-world", ...}' aria-label="Paste backup text"></textarea><div class="row"><button class="nbtn primary" type="button" data-m="doimport">Import</button></div>`;
    $('#mFile').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { $('#mPaste').value = String(rd.result || ''); msg.textContent = 'File loaded. Press Import.'; }; rd.readAsText(f); });
  }
  if (m === 'doimport') {
    let data = null; try { data = JSON.parse($('#mPaste').value); } catch (err) { msg.textContent = 'That text is not a valid backup.'; return; }
    if (data && typeof data.storage === 'object' && data.storage) {
      let n = 0; try { for (const [k, v] of Object.entries(data.storage)) if (typeof k === 'string' && typeof v === 'string' && k.length < 200) { localStorage.setItem(k, v); n++; } } catch (err) {}
      msg.textContent = 'Restored ' + n + ' saved items (galaxy + every trainer). Reloading…'; setTimeout(() => location.reload(), 900); return;
    }
    const src = data && typeof data === 'object' ? (data.moons || null) : null;
    if (!src || typeof src !== 'object') { msg.textContent = 'No progress found in that backup.'; return; }
    const clean = {}; let n = 0;
    for (const [k, v] of Object.entries(src)) if (/^[\w-]+:[\w-]+$/.test(k) && (v === 'progress' || v === 'mastered')) { clean[k] = v; n++; }
    PROG.moons = clean; saveProg(); paintProgress(); ui(); msg.textContent = 'Imported ' + n + ' unit' + (n === 1 ? '' : 's') + '.';
    refreshPanel();
  }
  if (m === 'reset') {
    if (Date.now() - resetArmed > 4000) { resetArmed = Date.now(); b.textContent = 'Tap again to reset them'; return; }
    PROG.moons = {}; saveProg(); paintProgress(); ui(); refreshPanel(); msg.textContent = 'Coming-soon moons set back to locked. Trainer progress was not touched.'; b.textContent = 'Reset coming-soon moons'; resetArmed = 0;
  }
});

/* ---------------- resize ---------------- */
function resize() {
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  skyMat.uniforms.uPR.value = renderer.getPixelRatio();
}
addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { paused = document.hidden; if (!paused) { last = performance.now(); requestAnimationFrame(loop); } });
addEventListener('pageshow', e => { if (e.persisted) { paintProgress(); ui(); } });

/* ---------------- main loop ---------------- */
function placePlanets(dt) {
  const k = REDUCED ? .3 : 1;
  planets.forEach(p => {
    p.angle += p.speed * dt * k;
    p.group.position.set(Math.cos(p.angle) * p.ring, 0, Math.sin(p.angle) * p.ring);
    p.mesh.rotation.y += dt * .07; if (p.clouds) p.clouds.rotation.y += dt * .085;
    p.arc.rotation.y = -p.angle;
    p.moons.forEach(m => { m.pivot.rotation.y += m.speed * dt * k; });
  });
  scene.updateMatrixWorld();
}
let last = performance.now(), T = 0, shake = 0, sunBoost = 0, frameN = 0; const vOff = { x: 0, y: 0 };
function loop(now) {
  if (paused) return;
  const dt = Math.min(.05, (now - last) / 1000); last = now; T += dt; frameN++;
  placePlanets(dt);
  stations.forEach((s, i) => { s.obj.rotation.y += dt * .12; });
  gate.rotation.z += dt * .05; vortexMat.uniforms.uT.value = T;
  // camera
  if (flight) stepFlight(now);
  else if (follow) { const tg = follow(); tmpV.copy(tg).sub(controls.target); controls.target.add(tmpV); camera.position.add(tmpV); }
  if (!flight) controls.update();
  const camD = camera.position.distanceTo(controls.target);
  camera.near = clamp(camD * .004, .002, 6); camera.updateProjectionMatrix();
  const on = panel.classList.contains('on'), narrow = innerWidth <= 700;
  const wantX = on && !narrow ? Math.min(220, (panel.offsetWidth + 14) / 2) : 0, wantY = on && narrow ? panel.offsetHeight * .45 : 0;
  vOff.x += (wantX - vOff.x) * Math.min(1, dt * 4); vOff.y += (wantY - vOff.y) * Math.min(1, dt * 4);
  if (Math.abs(vOff.x) > .5 || Math.abs(vOff.y) > .5) camera.setViewOffset(innerWidth, innerHeight, vOff.x, vOff.y, innerWidth, innerHeight); else camera.clearViewOffset();
  if (shake > 0) { shake = Math.max(0, shake - dt); const s = shake * .015 * camD; camera.position.x += (Math.random() - .5) * s; camera.position.y += (Math.random() - .5) * s; }
  skyGroup.position.copy(camera.position);
  // hover easing
  for (const pk of pickables) { const e = pk.ent, tgt = hovered === e ? 1 : 0; e.hover += (tgt - e.hover) * Math.min(1, dt * 8); }
  // galaxy markers
  const dSys = camera.position.distanceTo(SYS);
  sysMarker.scale.setScalar(clamp(dSys * .05, 1, 240) * (1 + SYS_ENT.hover * .4));
  sysMarker.material.opacity = smooth(25, 140, dSys);
  sysHalo.scale.setScalar(clamp(dSys * .11, 4, 520)); sysHalo.material.opacity = smooth(40, 220, dSys) * (.55 + sunBoost * .45);
  const dBiz = camera.position.distanceTo(BIZ);
  bizMarker.scale.setScalar(clamp(dBiz * .028, 1, 120) * (1 + BIZ_ENT.hover * .5)); bizMarker.material.opacity = smooth(25, 120, dBiz) * (.75 + .25 * Math.sin(T * 2));
  FUT.forEach(f => { const d = camera.position.distanceTo(f.pos); f.ent.obj.scale.setScalar(clamp(d * .026, 1, 90) * (1 + f.ent.hover * .5)); f.ent.obj.material.opacity = .55 + f.ent.hover * .45; });
  // sun + progress glows
  sunBoost += (sunTarget - sunBoost) * Math.min(1, dt * 2);
  sunMat.uniforms.uTime.value = T; sunMat.uniforms.uBoost.value = sunBoost + SUN_ENT.hover * .3;
  corona.scale.setScalar(SUN_R * (5.5 + sunBoost * 5 + SUN_ENT.hover * 1.5) * (1 + Math.sin(T * 1.3) * .015));
  corona.material.opacity = .65 + sunBoost * .35; sunLight.intensity = 3 + sunBoost * 1.2;
  const near = smooth(260, 60, dSys);
  SEMS.forEach(s => { s.ring.material.opacity = .24 * near; });
  discMat.uniforms.uTime.value = T; discMat.uniforms.uBoost.value = sunBoost; discFade += (((level === 'planet' || level === 'moon') ? .22 : 1) - discFade) * Math.min(1, dt * 2); discMat.uniforms.uFade.value = smooth(420, 90, dSys) * discFade; discMat.uniforms.uNear.value = clamp(camD * (level === 'planet' || level === 'moon' ? 2.6 : 1.4), 4, 30); discMat.uniforms.uN.value = Math.min(planets.length, MAXPL);
  planets.forEach((p, i) => { if (i < MAXPL) discMat.uniforms.uPl.value[i].set(p.group.position.x, p.group.position.z, p.R, 0); });
  haze.material.opacity = (.5 + sunBoost * .3) * smooth(400, 80, dSys) * discFade; rocks.rotation.y += dt * .006; rocks.visible = dSys < 600;
  planets.forEach(p => {
    const pct = p.pct || 0, pw = wpos(p.mesh, tmpW);
    p.shell.material.uniforms.uI.value = (pct * .75 + p.hover * .35) * (1 + Math.sin(T * 2 + p.ring) * .06) * smooth(p.R * 2.4, p.R * 4.5, pw.distanceTo(camera.position));
    p.atmo.material.uniforms.uSun.value.copy(SYS);
    if (p.ringMesh) p.ringMesh.material.uniforms.uCenter.value.copy(pw);
    p.arc.material.opacity = (p.soon ? .35 : .9) * near;
    const bp = p.beam.geometry.attributes.position, local = pw.clone().sub(SYS), L = local.length(), dir = local.clone().normalize();
    for (let i = 0; i < bp.count; i++) { const u = i / (bp.count - 1), d = SUN_R + (L - p.R * 1.2 - SUN_R) * u; bp.setXYZ(i, dir.x * d, dir.y * d + Math.sin(u * Math.PI) * .25, dir.z * d); }
    bp.needsUpdate = true; p.beam.material.uniforms.uT.value = T; p.beam.material.uniforms.uA.value = (p.soon ? .03 : .07 + pct * .45 + p.hover * .3) * near;
    const focusOn = focus.planet === p && (level === 'planet' || level === 'moon');
    p.moons.forEach(m => {
      m.orbit.material.opacity = (focusOn ? (m.state === 'locked' ? .28 : .75) : .07) * near;
      m.halo.material.opacity = (m.haloBase || 0) * (.85 + Math.sin(T * 2.4 + m.index) * .15) + m.hover * .8;
    });
  });
  const inside = smooth(260, 70, dSys);
  galaxyMats.forEach(m => { m.uniforms.uScale.value = pxScale(); m.uniforms.uOpacity.value = m.userData.baseOpacity * (1 - inside * .93); });
  fillLight.position.copy(camera.position).add(new THREE.Vector3(0, 6, 0)); fillLight.target.position.copy(controls.target); fillLight.intensity = inside * (level === 'planet' || level === 'moon' ? .22 : .55);
  rocks.children.forEach(o => { if (o.material.uniforms) o.material.uniforms.uScale.value = pxScale(); });
  skyMat.uniforms.uTime.value = T;
  if (frameN % 2 === 0) hoverStep();
  tagStep(); flareStep();
  composer.render(dt);
  requestAnimationFrame(loop);
}

/* ---------------- go ---------------- */
paintProgress(); ui();
const resumed = resume();
if (!resumed) startIntro();
requestAnimationFrame(t => { last = t; loop(t); $('#loader').classList.add('done'); });
buildTextures();
window.JW = { CLASSES, planets, goSystem, goPlanet, goMoon, goSun, goBusiness, goGalaxy, back, get level() { return level; }, setState };
}
</script>
<script>
/* App mode: save everything for offline use. */
if ('serviceWorker' in navigator) addEventListener('load', function () {
  // when a new version of the app takes over, reload once so you see it right away
  var hadSW = !!navigator.serviceWorker.controller, reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () { if (hadSW && !reloaded) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
    var list = performance.getEntriesByType('resource').map(function (e) { return e.name; });
    if (reg.active) reg.active.postMessage({ save: list });
  }).catch(function () {});
});
</script>
